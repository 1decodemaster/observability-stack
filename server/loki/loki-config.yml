auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 64
  allow_structured_metadata: true
  volume_enabled: true
  # Accept log entries up to 14 days old (default is 7d). Needed so client
  # crash-replay / first-run backfill isn't rejected.
  reject_old_samples_max_age: 14d
  # 90-day retention.
  retention_period: 2160h
