# =============================================================================
# Metrics Stack - SERVER (central aggregation)
# -----------------------------------------------------------------------------
# Deploy on one central machine (or a Proxmox VM/LXC):
#   docker compose up -d
#
# Clients (client/ directory) ship data here via Loki push + Prometheus
# remote_write. This stack has NO local scrape jobs — it only receives,
# stores, alerts and visualises.
#
# Ports:
#   grafana        3000   dashboards
#   prometheus     9090   query + remote_write receiver
#   loki           3100   log query + push (clients push here)
#   alertmanager   9093   alerts (channel configured in alertmanager/)
#   renderer       (none) PNG/PDF export backend; internal-only, Grafana calls
#                    it on the compose network. Auth token from server/.env
#                    (GF_RENDERING_AUTH_TOKEN); see README "Grafana image
#                    rendering".
# =============================================================================

name: metrics-stack-server

services:
  loki:
    image: grafana/loki:3.7.7
    container_name: metrics-stack-server-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: metrics-stack-server-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2160h
      # Required for clients' prometheus.remote_write to be accepted.
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: metrics-stack-server-alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    container_name: metrics-stack-server-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      # Image rendering (dashboard -> PNG/PDF). The in-container
      # grafana-image-renderer plugin is deprecated; this points at the
      # internal renderer service below. Both sides carry the same auth
      # token from server/.env (GF_RENDERING_AUTH_TOKEN); blank = the
      # built-in "-" default on both sides. See README "Grafana image
      # rendering".
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_RENDERING_AUTH_TOKEN=${GF_RENDERING_AUTH_TOKEN:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Standalone image renderer (headless Chromium) for PNG/PDF export.
  # Internal-only: no published port. Stateless: no volume.
  renderer:
    image: grafana/grafana-image-renderer:v5.12.5
    container_name: metrics-stack-server-renderer
    environment:
      # Must match grafana's GF_RENDERING_AUTH_TOKEN (same substitution).
      - SECRET_TOKEN=${GF_RENDERING_AUTH_TOKEN:-}
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:
