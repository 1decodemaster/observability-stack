# =============================================================================
# Metrics Stack - SERVER (central aggregation)
# -----------------------------------------------------------------------------
# Deploy on one central machine (or a Proxmox VM/LXC):
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
#
# Clients (client/ directory) ship data here via Loki push + Prometheus
# remote_write. In addition, the server scrapes ITSELF — its own host metrics,
# its own containers, and each stack component's /metrics — so that a full
# disk or a wedged Loki is visible instead of silently ending collection.
#
# Ports:
#   grafana        3000   dashboards
#   prometheus     9090   query + remote_write receiver
#   loki           3100   log query + push (clients push here)
#   alertmanager   9093   alerts (channel configured in alertmanager/)
#   node-exporter  9100   this host's metrics (host network namespace)
#   pve-exporter   9221   Proxmox VE metrics          (profile: pve)
# =============================================================================

name: metrics-stack-server

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  loki:
    image: grafana/loki:latest
    container_name: metrics-stack-server-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    container_name: metrics-stack-server-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:-2160h}
      # Second, independent bound: time-based retention alone cannot stop a
      # busy fleet from filling the disk.
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-50GB}
      # Required for clients' prometheus.remote_write to be accepted.
      - --web.enable-remote-write-receiver
    # node-exporter runs in the host network namespace; reach it via the gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    restart: unless-stopped
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:latest
    container_name: metrics-stack-server-alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: metrics-stack-server-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD in server/.env}
      # Exposes /metrics so Prometheus can tell whether Grafana is alive.
      - GF_METRICS_ENABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    logging: *default-logging

  # --- the server's own host, so a full disk is visible before it kills the
  # --- stack. Same host-netns requirement as on the clients.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: metrics-stack-server-node-exporter
    network_mode: host
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.processes
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/(user|credentials/.+)|var/lib/docker/.+|snap/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
      # --collector.systemd (node_systemd_unit_state) is deliberately NOT
      # enabled: it needs the D-Bus system bus, and stock AppArmor policy on
      # Ubuntu denies a container that access — the collector then logs an
      # error on every single scrape. Failed units are tracked from the
      # journal instead (syslog_unit_failed_total), which needs no privileges
      # and works on every distro. To use the collector anyway, add
      # `--collector.systemd` above, uncomment the mount below, and expect to
      # need an AppArmor exception on Ubuntu:
      #- /run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
    restart: unless-stopped
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: metrics-stack-server-cadvisor
    command:
      - --docker_only=true
      - --store_container_labels=false
      - --housekeeping_interval=15s
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,cpu_topology,resctrl
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    logging: *default-logging

  # --- Proxmox VE: guest (VM/LXC) state and storage/ZFS pool usage.
  # --- Enable with COMPOSE_PROFILES=pve after creating pve/pve.yml and
  # --- listing the PVE node in prometheus/targets/pve.json.
  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: metrics-stack-server-pve-exporter
    profiles: ["pve"]
    volumes:
      - ./pve/pve.yml:/etc/prometheus/pve.yml:ro
    ports:
      - "9221:9221"
    restart: unless-stopped
    logging: *default-logging

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:
