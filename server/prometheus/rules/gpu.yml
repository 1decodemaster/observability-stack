# GPU health. These are the GPU counterpart to the DIMM CE/UE rules in ras.yml:
# double-bit ECC errors and retired/remapped rows are the signals that a card
# is failing, and XID errors are how the driver reports a fault it recovered
# from (or didn't).
groups:
  - name: gpu
    rules:
      - alert: GpuUncorrectedEccError
        expr: |
          sum by (machine, gpu) (
            increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL[10m])
          ) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Double-bit GPU ECC error on {{ $labels.machine }} GPU {{ $labels.gpu }}"
          description: "An uncorrectable ECC error occurred in GPU memory. This is the GPU equivalent of a DIMM UE — the card should be considered suspect and the workload moved off it."

      - alert: GpuCorrectedEccBurst
        expr: |
          sum by (machine, gpu) (
            increase(DCGM_FI_DEV_ECC_SBE_VOL_TOTAL[1h])
          ) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Burst of single-bit GPU ECC errors on {{ $labels.machine }} GPU {{ $labels.gpu }}"
          description: "More than 100 correctable ECC errors in an hour. Leading indicator of degrading VRAM."

      - alert: GpuRowRemapFailure
        expr: DCGM_FI_DEV_ROW_REMAP_FAILURE > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "GPU row remap failure on {{ $labels.machine }} GPU {{ $labels.gpu }}"
          description: "The GPU exhausted its spare memory rows or failed to remap one. The card needs replacing."

      - alert: GpuPendingRowRemap
        expr: DCGM_FI_DEV_RETIRED_PENDING > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "GPU pages pending retirement on {{ $labels.machine }} GPU {{ $labels.gpu }}"
          description: "The GPU has pages awaiting retirement; a reset is needed to apply them."

      - alert: GpuXidError
        expr: |
          changes(DCGM_FI_DEV_XID_ERRORS[10m]) > 0
          and DCGM_FI_DEV_XID_ERRORS > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "GPU XID {{ $value }} on {{ $labels.machine }} GPU {{ $labels.gpu }}"
          description: "The NVIDIA driver reported an XID error. Cross-reference the code against NVIDIA's XID table; 48/63/64/92/94/95 indicate memory or hardware faults."

      - alert: GpuTempHigh
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GPU over 85C on {{ $labels.machine }} GPU {{ $labels.gpu }}"
          description: "Sustained high GPU temperature — the card is likely thermal throttling. Check airflow and fan curves."

      - alert: GpuThermalThrottling
        expr: |
          sum by (machine, gpu) (rate(DCGM_FI_DEV_THERMAL_VIOLATION[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "GPU thermal throttling on {{ $labels.machine }} GPU {{ $labels.gpu }}"
          description: "The GPU has been clock-limited by temperature for 15 minutes; throughput is below what the card can do."

      - alert: GpuMemoryNearlyFull
        expr: |
          100 * DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > 95
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "GPU VRAM over 95% on {{ $labels.machine }} GPU {{ $labels.gpu }}"
          description: "Little framebuffer memory left; the next allocation is likely to fail."
