# Hardware RAS / thermal alerts. Multi-host: every rule is grouped by the
# `machine` external label stamped by client Alloy agents.
groups:
  - name: ras
    rules:
      # Any uncorrected memory error is a hard failure signal.
      - alert: RasUncorrectedError
        expr: sum by (machine) (increase(ras_mc_event_total{err_type="uncorrected"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Uncorrected memory error (UE) on {{ $labels.machine }}"
          description: "A non-correctable memory ECC error was logged. Inspect and replace the affected DIMM. Run `sudo ras-mc-ctl --summary` on the host."

      # A burst of corrected errors is the leading indicator of a dying DIMM
      # (e.g. 108 CEs in ~9s observed on pensive 2026-08-27).
      - alert: RasCorrectedErrorBurst
        expr: sum by (machine) (increase(ras_mc_event_total{err_type="corrected"}[10m])) > 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Burst of corrected memory errors (CE) on {{ $labels.machine }}"
          description: "More than 20 corrected memory errors in 10 minutes. Likely a degrading DIMM. Check `sudo ras-mc-ctl --summary` for the affected channel/DIMM."

      # Hottest hardware sensor (typically the CPU Tctl) running too hot.
      - alert: HostTempHigh
        expr: max by (machine) (node_hwmon_temp_celsius) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hardware temperature high on {{ $labels.machine }}"
          description: "The hottest hwmon sensor is above 85C for 5 minutes. Verify CPU/fan cooling and airflow."

      # DIMM temperature above the BMC's upper non-critical threshold, with a
      # 85C fallback for sensors whose threshold the BMC does not publish
      # (unpublished thresholds export as NaN and never match a comparison,
      # so only the fallback branch fires for those).
      - alert: MemTempHigh
        expr: (ipmi_mem_temp_celsius > ipmi_mem_temp_upper_non_crit_celsius)
              or
              (ipmi_mem_temp_celsius > 85 unless (ipmi_mem_temp_celsius > ipmi_mem_temp_upper_non_crit_celsius))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory temperature high on {{ $labels.machine }} ({{ $labels.sensor }})"
          description: "DIMM {{ $labels.sensor }} is above its BMC upper non-critical threshold (or 85C when the BMC publishes none) for 5 minutes. Check cooling and airflow."

      # DIMM temperature above the BMC's upper CRITICAL threshold, with a 95C
      # fallback. This is the "runs high temp" state: sustained over-temperature
      # risks DIMM failure and CE storms.
      - alert: MemTempCritical
        expr: (ipmi_mem_temp_celsius > ipmi_mem_temp_upper_crit_celsius)
              or
              (ipmi_mem_temp_celsius > 95 unless (ipmi_mem_temp_celsius > ipmi_mem_temp_upper_crit_celsius))
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Memory temperature CRITICAL on {{ $labels.machine }} ({{ $labels.sensor }})"
          description: "DIMM {{ $labels.sensor }} is above its BMC upper critical threshold (or 95C when the BMC publishes none). Verify cooling immediately."
